.opt{display:block;width:100%;text-align:left;margin:8px 0}.opt.ok{background:var(--ok);color:#fff}.opt.no{background:var(--bad);color:#fff}

.cur:after{content:"_";animation:bl .6s steps(2) infinite}

.mascot{display:inline-block;animation:hop 1s steps(2) infinite}
footer{text-align:center;padding:20px 16px 28px;font-size:13px;color:var(--mut);border-top:4px solid var(--ink);margin-top:20px}

@media(max-width:560px){.meta{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
a.btn{display:inline-block;text-decoration:none}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:16px}.two .card{margin-bottom:0}
.quote{font-weight:800;line-height:1.5;border-left:6px solid var(--t);padding-left:12px;margin:8px 0 12px}

.lvs{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.lvs .btn{font-size:11px;padding:1px 6px;box-shadow:2px 2px 0 var(--ink)}
.about{display:flex;gap:18px;align-items:center;flex-wrap:wrap}

.ph0{width:100%;height:100%;place-content:center;text-align:center;color:#fff8ec;font-size:38px;gap:8px}.ph0 small{font:700 11px Nunito}
.tips li,.feat li{margin:5px 0}.cts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

#boot{position:fixed;inset:0;z-index:50;background:var(--t);color:#fff8ec;display:grid;place-items:center;text-align:center;padding:20px;overflow:hidden;cursor:pointer}

<script>(function(){var W=18,H=14,r=[],x,y;function ins(x,y){var a=(x-8.5)/8,b=(y-5.5)/5.8;return a*a+b*b<=1}

r.push([6,4,"#3B2A22"],[6,5,"#3B2A22"],[11,4,"#3B2A22"],[11,5,"#3B2A22"]);

[[900,"Memuat materi"],[1800,"Siap ngoding!"]].forEach(function(m){setTimeout(function(){var e=document.getElementById("bootmsg");if(e)e.textContent=m[1]},m[0])});
setTimeout(bootEnd,2700)})()</script>

p kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","q":"CREATE TABLE arsip (\n  id INTEGER,\n  nama TEXT\n);\n\nALTER TABLE arsip RENAME TO arsip_siswa;\n\n-- Pilihan operasi berikut bergantung pada DBMS:\n-- TRUNCATE TABLE arsip_siswa;\n-- DROP TABLE arsip_siswa;\n\nSELECT 'DDL: CREATE, ALTER, RENAME, TRUNCATE, DROP' AS info;","ck":[["q","/CREATE\\s+TABLE/i"],["q","/ALTER\\s+TABLE/i"],["q","/RENAME\\s+TO/i"],["q","/TRUNCATE\\s+TABLE/i"],["q","/DROP\\s+TABLE/i"]],"warn":"Pakai DROP/TRUNCATE dengan hati-hati; detail sintaks dan transaksi berbeda menurut DBMS."}],"kotlin":[{"lv":"Dasar","t":"Program pertama: fun main dan println","b":"Program Kotlin berjalan dari fungsi <code>main<\/code>. <code>println<\/code> nyetak teks dengan baris baru, sementara <code>print<\/code> tanpa baris baru. Kotlin nggak pakai titik koma di akhir baris.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: Program pertama: fun main dan println.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/fun\\s+main/i"],["kt","/println\\(/i"],["kt","/print\\(/i"]],"kt":"fun main() {\n    println(\"Halo, Kotlin!\")\n    print(\"Tanpa baris baru, \")\n    println(\"lalu baris baru\")\n}\n"},{"lv":"Dasar","t":"val, var, dan inferensi tipe","b":"<code>val<\/code> itu nilai yang nggak bisa diubah (read-only), <code>var<\/code> bisa diubah. Kotlin menebak tipe dari nilainya (inferensi), tapi tipe boleh ditulis eksplisit dengan <code>: Tipe<\/code>. Pakai <code>val<\/code> sebisa mungkin.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: val, var, dan inferensi tipe.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/\\bval\\b/i"],["kt","/\\bvar\\b/i"],["kt","/:\\s*Double/i"]],"kt":"fun main() {\n    val nama = \"Rafi\"\n    var umur = 20\n    umur = 21\n    val tinggi: Double = 170.5\n    println(\"$nama $umur $tinggi\")\n}\n"},{"lv":"Dasar","t":"String template dan operasi string","b":"Template menyisipkan nilai ke dalam teks: <code>$nama<\/code> buat variabel, <code>${ekspresi}<\/code> buat ekspresi. String punya banyak fungsi bawaan kayak <code>uppercase()<\/code>, <code>length<\/code>, dan <code>reversed()<\/code>.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: String template dan operasi string.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/\\$nama/i"],["kt","/\\$\\{/i"],["kt","/uppercase\\(\\)/i"],["kt","/split\\(/i"]],"kt":"fun main() {\n    val nama = \"Ani\"\n    val nilai = 85\n    println(\"Halo $nama, nilai ${nilai + 5}\")\n    println(nama.uppercase() + \" \" + nama.length)\n    println(\"kotlin\".reversed())\n    println(\"a,b,c\".split(\",\"))\n}\n"},{"lv":"Dasar","t":"Tipe Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/\\bif\\s*\\(/i"],["kt","/\\belse\\b/i"],["kt","/val\\s+grade\\s*=\\s*if/i"]],"kt":"fun main() {\n    val nilai = 82\n    if (nilai >= 75) {\n        println(\"Lulus\")\n    } else {\n        println(\"Remedial\")\n    }\n    val grade = if (nilai >= 85) \"A\" else if (nilai >= 70) \"B\" else \"C\"\n    println(grade)\n}\n"},{"lv":"Dasar","t":"when: pengganti switch","b":"<code>when<\/code> mencocokkan nilai dengan banyak kondisi: nilai tunggal, beberapa nilai dipisah koma, rentang (<code>in 4..5<\/code>), dan tipe (<code>is<\/code>). Ia juga bisa dipakai sebagai ekspresi.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: when: pengganti switch.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/\\bwhen\\s*\\(/i"],["kt","/in\\s+4\\.\\.5/i"],["kt","/\\bis\\s+Int/i"],["kt","/\\belse\\s*->/i"]],"kt":"fun main() {\n    val hari = 3\n    val nama = when (hari) {\n        1 -> \"Senin\"\n        2, 3 -> \"Selasa atau Rabu\"\n        in 4..5 -> \"Kamis-Jumat\"\n        else -> \"Akhir pekan\"\n    }\n    println(nama)\n    val x: Any = 42\n    when (x) {\n        is String -> println(\"teks\")\n        is Int -> println(\"angka\")\n        else -> println(\"lain\")\n    }\n}\n"},{"lv":"Dasar","t":"Perulangan: for, while, dan range","b":"<code>for (i in 1..3)<\/code> pakai range inklusif, <code>until<\/code> mengecualikan ujung, <code>downTo<\/code> ngitung mundur, dan <code>step<\/code> ngatur loncatan. <code>while<\/code> ngulang selama kondisi benar.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: Perulangan: for, while, dan range.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/for\\s*\\(i\\s+in\\s+1\\.\\.3\\)/i"],["kt","/downTo/i"],["kt","/until/i"],["kt","/step/i"],["kt","/while\\s*\\(/i"]],"kt":"fun main() {\n    for (i in 1..3) println(\"i = $i\")\n    for (i in 10 downTo 7) print(\"$i \")\n    println()\n    for (i in 0 until 10 step 3) print(\"$i \")\n    println()\n    var n = 3\n    while (n > 0) {\n        println(\"hitung $n\")\n        n--\n    }\n}\n"},{"lv":"Dasar","t":"Function: parameter default dan single-expression","b":"Fungsi dideklarasikan dengan <code>fun<\/code>, tipe parameter dan tipe kembalian ditulis dengan <code>:<\/code>. Parameter boleh punya nilai default, dan fungsi satu ekspresi bisa ditulis dengan <code>=<\/code>.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: Function: parameter default dan single-expression.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/fun\\s+sapa/i"],["kt","/salam:\\s*String\\s*=\\s*\"/i"],["kt","/fun\\s+kuadrat\\(x:\\s*Int\\)\\s*=/i"]],"kt":"fun sapa(nama: String, salam: String = \"Halo\"): String {\n    return \"$salam, $nama!\"\n}\nfun kuadrat(x: Int) = x * x\nfun main() {\n    println(sapa(\"Rafi\"))\n    println(sapa(\"Ani\", \"Selamat pagi\"))\n    println(kuadrat(5))\n}\n"},{"lv":"Dasar","t":"List dasar: listOf dan mutableListOf","b":"<code>listOf<\/code> bikin list read-only, <code>mutableListOf<\/code> bikin list yang bisa diubah (<code>add<\/code>, <code>removeAt<\/code>). Elemen diakses dengan indeks <code>[i]<\/code>, dan ada <code>first()<\/code>, <code>last()<\/code>, <code>size<\/code>.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: List dasar: listOf dan mutableListOf.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/listOf\\(/i"],["kt","/mutableListOf\\(/i"],["kt","/\\.add\\(/i"],["kt","/\\.removeAt\\(/i"]],"kt":"fun main() {\n    val tetap = listOf(\"a\", \"b\", \"c\")\n    val bisa = mutableListOf(1, 2, 3)\n    bisa.add(4)\n    bisa.removeAt(0)\n    println(tetap.size)\n    println(bisa)\n    println(tetap[1] + tetap.first() + tetap.last())\n    println(bisa.contains(3))\n}\n"},{"lv":"Menengah","t":"Null safety: ?, ?., ?:, dan !!","b":"Tipe biasa jangan null; tipe nullable ditulis <code>String?<\/code>. Operator <code>?.<\/code> manggil cuma kalau nggak null, <code>?:<\/code> (Elvis) ngasih nilai cadangan, dan <code>!!<\/code> memaksa non-null dan melempar error bila null.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: Null safety: ?, ?., ?:, dan !!.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/String\\?/i"],["kt","/\\?\\.length/i"],["kt","/\\?:/i"],["kt","/=\\s*null/i"]],"kt":"fun main() {\n    var nama: String? = \"Rafi\"\n    println(nama?.length)\n    nama = null\n    println(nama?.length)\n    println(nama ?: \"tanpa nama\")\n    val panjang = nama?.length ?: 0\n    println(panjang)\n}\n"},{"lv":"Menengah","t":"Collections: filter, map, fold","b":"Fungsi koleksi bergaya fungsional ngubah data tanpa loop manual: <code>filter<\/code> menyaring, <code>map<\/code> ngubah tiap elemen, <code>fold<\/code> mengakumulasi, <code>any<\/code> ngecek. Lambda pakai <code>it<\/code> buat satu parameter.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: Collections: filter, map, fold.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/\\.filter\\s*\\{/i"],["kt","/\\.map\\s*\\{/i"],["kt","/\\.fold\\(0\\)/i"],["kt","/\\.any\\s*\\{/i"]],"kt":"fun main() {\n    val angka = listOf(1, 2, 3, 4, 5, 6)\n    println(angka.filter { it % 2 == 0 })\n    println(angka.map { it * it })\n    println(angka.sum())\n    println(angka.fold(0) { acc, x -> acc + x })\n    println(angka.any { it > 5 })\n    println(angka.sortedDescending().take(3))\n}\n"},{"lv":"Menengah","t":"Map dan Set","b":"<code>mapOf<\/code> nyimpen pasangan kunci-nilai (dibikin dengan <code>to<\/code>), <code>mutableMapOf<\/code> bisa diubah lewat <code>map[kunci] = nilai<\/code>. <code>setOf<\/code> nyimpen nilai unik. Map bisa di-destructure di <code>for<\/code>.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: Map dan Set.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/mutableMapOf\\(/i"],["kt","/\\bto\\b/i"],["kt","/getOrDefault/i"],["kt","/setOf\\(/i"]],"kt":"fun main() {\n    val nilai = mutableMapOf(\"Ani\" to 90, \"Budi\" to 75)\n    nilai[\"Cici\"] = 85\n    println(nilai)\n    println(nilai[\"Ani\"])\n    println(nilai.getOrDefault(\"Dedi\", 0))\n    println(nilai.containsKey(\"Budi\"))\n    for ((nama, n) in nilai) println(\"$nama: $n\")\n    val unik = setOf(1, 2, 2, 3)\n    println(unik)\n    println(unik.size)\n}\n"},{"lv":"Menengah","t":"Lambda dan higher-order function","b":"Fungsi itu nilai: bisa disimpan di variabel, dikirim sebagai parameter, dan dikembalikan. Lambda ditulis <code>{ parameter -> isi }<\/code>. Kalau lambda itu argumen terakhir, boleh diletakkan di luar tanda kurung (trailing lambda).","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: Lambda dan higher-order function.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/f:\\s*\\(Int,\\s*Int\\)\\s*->\\s*Int/i"],["kt","/\\{\\s*x:\\s*Int,\\s*y:\\s*Int\\s*->/i"],["kt","/\\bit\\b/i"],["kt","/forEach/i"]],"kt":"fun operasi(a: Int, b: Int, f: (Int, Int) -> Int): Int = f(a, b)\nfun main() {\n    val tambah = { x: Int, y: Int -> x + y }\n    println(operasi(2, 3, tambah))\n    println(operasi(4, 5) { a, b -> a * b })\n    val kali2: (Int) -> Int = { it * 2 }\n    println(kali2(7))\n    listOf(1, 2, 3).forEach { println(it) }\n}\n"},{"lv":"Menengah","t":"Class dan properti","b":"Class mendeklarasikan properti langsung di constructor utama dengan <code>val/var<\/code>. Properti tambahan dan method ditulis di badan class. Objek dibikin tanpa kata <code>new<\/code>.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: Class dan properti.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/class\\s+Siswa\\(val\\s+nama/i"],["kt","/var\\s+aktif/i"],["kt","/fun\\s+lulus/i"],["kt","/Siswa\\(\\\"Ani\\\"/i"]],"kt":"class Siswa(val nama: String, var nilai: Int) {\n    var aktif = true\n    fun lulus(): Boolean = nilai >= 75\n    fun info() {\n        println(\"$nama: $nilai, lulus=${lulus()}\")\n    }\n}\nfun main() {\n    val s = Siswa(\"Ani\", 80)\n    s.info()\n    s.nilai = 60\n    s.info()\n    println(s.aktif)\n}\n"},{"lv":"Menengah","t":"Data class","b":"<code>data class<\/code> otomatis bikin <code>toString<\/code>, <code>equals<\/code>, <code>copy<\/code>, dan destructuring. Cocok buat nyimpen data. Dua data class dengan isi sama dianggap sama oleh <code>==<\/code>.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: Data class.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/data\\s+class\\s+Siswa/i"],["kt","/\\.copy\\(/i"],["kt","/==\\s*Siswa/i"],["kt","/val\\s+\\(n,\\s*v\\)/i"]],"kt":"data class Siswa(val nama: String, var nilai: Int = 70)\nfun main() {\n    val s = Siswa(\"Ani\")\n    val t = s.copy(nilai = 90)\n    println(s)\n    println(t)\n    println(s == Siswa(\"Ani\"))\n    val (n, v) = t\n    println(\"$n $v\")\n}\n"},{"lv":"Menengah","t":"Inheritance: open dan override","b":"Class Kotlin bersifat final secara default; tambahin <code>open<\/code> biar bisa diwarisi dan biar method boleh ditimpa dengan <code>override<\/code>. Pewarisan ditulis dengan <code>:<\/code> dan manggil constructor induk.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: Inheritance: open dan override.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/open\\s+class\\s+Hewan/i"],["kt","/open\\s+fun\\s+suara/i"],["kt","/override\\s+fun\\s+suara/i"],["kt","/:\\s*Hewan\\(nama\\)/i"]],"kt":"open class Hewan(val nama: String) {\n    open fun suara(): String = \"...\"\n    fun perkenalan() {\n        println(\"Aku $nama, suaraku ${suara()}\")\n    }\n}\nclass Kucing(nama: String) : Hewan(nama) {\n    override fun suara(): String = \"meong\"\n}\nclass Anjing(nama: String) : Hewan(nama) {\n    override fun suara(): String = \"guk\"\n}\nfun main() {\n    val hewan: List<Hewan> = listOf(Kucing(\"Mimi\"), Anjing(\"Doggo\"))\n    for (h in hewan) h.perkenalan()\n}\n"},{"lv":"Menengah","t":"Abstract class dan interface","b":"<code>abstract class<\/code> nggak bisa dibikin langsung dan boleh punya method abstrak yang wajib diimplementasikan subclass. <code>interface<\/code> mendefinisikan kontrak dan boleh muat implementasi default; satu class bisa mengimplementasikan banyak interface.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: Abstract class dan interface.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/abstract\\s+class/i"],["kt","/abstract\\s+fun/i"],["kt","/override\\s+fun\\s+luas/i"],["kt","/interface/i"]],"kt":"abstract class Bentuk {\n    abstract fun luas(): Int\n    fun cetak() {\n        println(\"Luas = ${luas()}\")\n    }\n}\nclass Persegi(val sisi: Int) : Bentuk() {\n    override fun luas(): Int = sisi * sisi\n}\n// interface Bisa { fun jalan() { println(\"jalan\") } }\n// class Robot : Bisa, Mesin   // banyak interface (butuh Kotlin asli)\nfun main() {\n    Persegi(4).cetak()\n}\n","lim":"Konsep sebagian. Interface dengan implementasi default butuh Kotlin asli; simulator cuma jalanin abstract class."},{"lv":"Menengah","t":"Exception: try, catch, finally, dan require","b":"Error ditangani dengan <code>try/catch/finally<\/code>; <code>try<\/code> juga ekspresi. <code>require<\/code> memvalidasi argumen (melempar <code>IllegalArgumentException<\/code>), dan <code>toIntOrNull()<\/code> ngubah teks ke angka tanpa exception.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: Exception: try, catch, finally, dan require.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/require\\(/i"],["kt","/try\\s*\\{/i"],["kt","/catch\\s*\\(e:/i"],["kt","/finally/i"]],"kt":"fun bagi(a: Int, b: Int): Int {\n    require(b != 0) { \"pembagi tidak boleh nol\" }\n    return a.div(b)\n}\nfun main() {\n    try {\n        println(bagi(10, 2))\n        println(bagi(1, 0))\n    } catch (e: IllegalArgumentException) {\n        println(\"Error: ${e.message}\")\n    } finally {\n        println(\"selesai\")\n    }\n    val angka = \"abc\".toIntOrNull()\n    println(angka ?: \"bukan angka\")\n}\n"},{"lv":"Menengah","t":"enum class dan state terdefinisi","b":"<code>enum class<\/code> cocok buat kumpulan pilihan yang udah diketahui, kayak status atau level. Enum bisa dipakai bersama <code>when<\/code> biar tiap state ditangani dengan jelas.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: enum class dan state terdefinisi.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/enum\\s+class/i"],["kt","/Status/i"],["kt","/when\\(status\\)/i"],["kt","/Status\\.SELESAI/i"]],"kt":"enum class Status { AKTIF, SELESAI, GAGAL }\n\nfun label(status: Status): String = when(status) {\n    Status.AKTIF -> \"Sedang berjalan\"\n    Status.SELESAI -> \"Selesai\"\n    Status.GAGAL -> \"Gagal\"\n}\n\nfun main() {\n    println(label(Status.SELESAI))\n}","lim":"Enum itu fitur Kotlin asli; simulator mini mungkin nggak dukung semua perilaku enum."},{"lv":"Menengah","t":"Testing: require, check, dan fungsi uji","b":"<code>require(kondisi) { pesan }<\/code> memvalidasi argumen (<code>IllegalArgumentException<\/code>), <code>check<\/code> memvalidasi keadaan (<code>IllegalStateException<\/code>). Tanpa framework, bikin fungsi <code>uji<\/code> yang nyetak PASS/FAIL. Framework nyata: JUnit dan kotlin.test.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: Testing: require, check, dan fungsi uji.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/require\\(/i"],["kt","/fun\\s+uji/i"],["kt","/PASS/i"],["kt","/IllegalArgumentException/i"]],"kt":"fun kuadrat(x: Int): Int {\n    require(x >= 0) { \"x tidak boleh negatif\" }\n    return x * x\n}\nfun uji(nama: String, kondisi: Boolean) {\n    println((if (kondisi) \"PASS \" else \"FAIL \") + nama)\n}\nfun main() {\n    uji(\"kuadrat 3\", kuadrat(3) == 9)\n    uji(\"kuadrat 0\", kuadrat(0) == 0)\n    uji(\"salah sengaja\", kuadrat(2) == 5)\n    try {\n        kuadrat(-1)\n    } catch (e: IllegalArgumentException) {\n        println(\"require menolak: ${e.message}\")\n    }\n}","lim":"JUnit/kotlin.test butuh kotlinc/Gradle; jalanin di tool asli (kotlinc). Simulator cuma jalanin pola fungsi uji kayak ini."},{"lv":"Lanjut","t":"Extension function","b":"Extension function menambah fungsi pada tipe yang udah ada tanpa mewarisinya: <code>fun TipeReceiver.nama()<\/code>. Di dalamnya, <code>this<\/code> merujuk ke objek penerima.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: Extension function.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/fun\\s+String\\.seru/i"],["kt","/fun\\s+Int\\.kuadrat/i"],["kt","/\\bthis\\b/i"]],"kt":"fun String.seru(): String = this + \"!\"\nfun Int.kuadrat(): Int = this * this\nfun main() {\n    println(\"halo\".seru())\n    println(5.kuadrat())\n}\n"},{"lv":"Lanjut","t":"Scope function: let dan also","b":"<code>let<\/code> jalanin blok dengan objek sebagai <code>it<\/code> dan mengembalikan hasil blok (sering dengan <code>?.<\/code> buat null safety). <code>also<\/code> jalanin aksi tambahan terus mengembalikan objek yang sama. <code>apply<\/code>, <code>run<\/code>, dan <code>with<\/code> pakai receiver <code>this<\/code>.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: Scope function: let dan also.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/\\?\\.let\\s*\\{/i"],["kt","/\\.also\\s*\\{/i"],["kt","/apply|run|with/i"]],"kt":"fun main() {\n    val nama: String? = \"rafi\"\n    nama?.let { println(\"Panjang: ${it.length}\") }\n    val angka = listOf(3, 1, 2).also { println(\"sebelum: $it\") }.sorted()\n    println(angka)\n    // apply/run/with pakai receiver \"this\" (butuh Kotlin asli)\n}\n","lim":"Simulator cuma dukung let dan also; apply/run/with butuh Kotlin asli."},{"lv":"Lanjut","t":"object, companion object, dan singleton","b":"<code>object<\/code> bikin singleton (satu instance), dan <code>companion object<\/code> nyimpen anggota level class (pengganti static). Kotlin nggak punya kata kunci <code>static<\/code>.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: object, companion object, dan singleton.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/object\\s+Konfigurasi/i"],["kt","/companion\\s+object/i"],["kt","/singleton|Pengguna/i"]],"kt":"// object Konfigurasi { val versi = \"1.0\" }\n// class Pengguna(val nama: String) {\n//     companion object { fun dariTeks(t: String) = Pengguna(t) }\n// }\n// println(Konfigurasi.versi)\nfun main() {\n    println(\"object = singleton, companion object = anggota milik class\")\n}\n","lim":"Konsep. object dan companion object butuh Kotlin asli; simulator belum dukung."},{"lv":"Lanjut","t":"Sealed class dan when yang lengkap","b":"<code>sealed class<\/code> membatasi subclass yang mungkin (semuanya diketahui saat kompilasi), jadi <code>when<\/code> nggak butuh <code>else<\/code> dan compiler mastiin semua kasus tertangani. Cocok buat status hasil kayak sukses/gagal.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: Sealed class dan when yang lengkap.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/sealed\\s+class\\s+Hasil/i"],["kt","/is\\s+Sukses/i"],["kt","/is\\s+Gagal/i"],["kt","/data\\s+class/i"]],"kt":"// sealed class Hasil\n// data class Sukses(val data: String) : Hasil()\n// data class Gagal(val pesan: String) : Hasil()\nopen class Hasil\ndata class Sukses(val data: String) : Hasil()\ndata class Gagal(val pesan: String) : Hasil()\nfun tampil(h: Hasil) {\n    when (h) {\n        is Sukses -> println(\"OK: ${h.data}\")\n        is Gagal -> println(\"Gagal: ${h.pesan}\")\n        else -> println(\"?\")\n    }\n}\nfun main() {\n    tampil(Sukses(\"data\"))\n    tampil(Gagal(\"timeout\"))\n}\n","lim":"Konsep sebagian. sealed class butuh Kotlin asli; simulator pakai open class sebagai padanan."},{"lv":"Lanjut","t":"Generics","b":"Generics bikin class dan fungsi bekerja buat banyak tipe dengan tetap aman: <code>class Kotak&lt;T&gt;<\/code>, <code>fun &lt;T&gt; nama()<\/code>. Tipe diketahui saat kompilasi (type erasure saat runtime).","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: Generics.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/class\\s+Kotak<T>/i"],["kt","/fun\\s+<T>\\s+tengah/i"],["kt","/Kotak<Int>/i"]],"kt":"class Kotak<T>(val isi: T) {\n    fun ambil(): T = isi\n}\nfun <T> tengah(daftar: List<T>): T = daftar[daftar.size / 2]\nfun main() {\n    val k = Kotak<Int>(5)\n    println(k.ambil())\n    println(Kotak(\"teks\").ambil())\n    println(tengah(listOf(\"a\", \"b\", \"c\")))\n}\n"},{"lv":"Lanjut","t":"Collections lanjutan: groupBy, partition, zip, sortedBy","b":"Operasi lanjutan: <code>groupBy<\/code> mengelompokkan ke map, <code>partition<\/code> memisah menjadi dua list, <code>zip<\/code> memasangkan dua list, <code>sortedBy<\/code> ngurutin berdasarkan kunci, <code>distinct<\/code>, <code>chunked<\/code>, dan <code>joinToString<\/code>.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: Collections lanjutan: groupBy, partition, zip, sortedBy.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/groupBy/i"],["kt","/partition/i"],["kt","/zip\\(/i"],["kt","/sortedBy/i"],["kt","/joinToString/i"]],"kt":"data class Siswa(val nama: String, val nilai: Int)\nfun main() {\n    val data = listOf(Siswa(\"Ani\", 90), Siswa(\"Budi\", 70), Siswa(\"Cici\", 85))\n    println(data.sortedBy { it.nilai }.map { it.nama })\n    println(data.groupBy { it.nilai >= 80 })\n    val (lulus, remedial) = data.partition { it.nilai >= 80 }\n    println(lulus.size.toString() + \" lulus, \" + remedial.size + \" remedial\")\n    println(listOf(1, 2).zip(listOf(\"a\", \"b\")))\n    println(listOf(1, 1, 2, 3).distinct().joinToString(\" | \"))\n    println(listOf(1, 2, 3, 4, 5).chunked(2))\n}\n"},{"lv":"Lanjut","t":"Sequence dan evaluasi lazy","b":"<code>asSequence()<\/code> memproses koleksi secara lazy: tiap elemen melewati semua rantai operasi satu per satu, bukan satu operasi buat semua elemen. Hemat memori buat data besar atau berantai panjang.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: Sequence dan evaluasi lazy.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/asSequence\\(\\)/i"],["kt","/\\.filter\\s*\\{/i"],["kt","/\\.map\\s*\\{/i"],["kt","/\\.take\\(3\\)/i"]],"kt":"fun main() {\n    val hasil = (1..10).toList().asSequence()\n        .filter { it % 2 == 0 }\n        .map { it * 10 }\n        .take(3)\n        .toList()\n    println(hasil)\n}\n","lim":"Simulator jalanin secara eager (bukan lazy). Hasil akhir sama, tapi urutan evaluasi di Kotlin asli berbeda."},{"lv":"Lanjut","t":"Coroutines: suspend, launch, async","b":"Coroutine itu cara ringan nulis kode asinkron berurutan. <code>suspend fun<\/code> bisa ditangguhkan tanpa memblokir thread, <code>launch<\/code> jalanin tugas, <code>async/await<\/code> ngehasilin nilai, dan <code>delay<\/code> menunda. Membutuhkan library <code>kotlinx.coroutines<\/code>.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: Coroutines: suspend, launch, async.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/suspend\\s+fun/i"],["kt","/runBlocking/i"],["kt","/async/i"],["kt","/launch/i"]],"kt":"// suspend fun ambilData(): String { delay(1000); return \"data\" }\n// fun main() = runBlocking {\n//     val a = async { ambilData() }\n//     launch { println(\"berjalan paralel\") }\n//     println(a.await())\n// }\nfun main() {\n    println(\"coroutine = konkurensi ringan berbasis suspend\")\n}\n","lim":"Konsep. Coroutines butuh Kotlin asli dengan kotlinx.coroutines; simulator nggak menjalankannya."},{"lv":"Lanjut","t":"Properti lanjutan: getter/setter, lazy, lateinit","b":"Properti bisa punya <code>get()<\/code> dan <code>set(value)<\/code> kustom dengan <code>field<\/code> sebagai penyimpanan. <code>by lazy<\/code> ngitung nilai saat pertama diakses, dan <code>lateinit var<\/code> menunda inisialisasi properti non-null.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: Properti lanjutan: getter/setter, lazy, lateinit.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/set\\(value\\)/i"],["kt","/by\\s+lazy/i"],["kt","/lateinit\\s+var/i"],["kt","/field/i"]],"warn":"Konsep. Properti kustom, lazy, dan lateinit butuh Kotlin asli.","kt":"// class Kotak { var lebar = 0\n//     set(value) { field = value.coerceAtLeast(0) } }\n// val berat by lazy { println(\"dihitung sekali\"); 42 }\n// lateinit var layanan: String\nfun main() {\n    println(\"getter/setter, lazy, dan lateinit mengatur cara properti diisi\")\n}\n"},{"lv":"Lanjut","t":"Operator overloading dan infix function","b":"Operator kayak <code>+<\/code> dan <code>[]<\/code> bisa didefinisikan ulang dengan <code>operator fun plus<\/code>, <code>get<\/code>, dan lainnya. Fungsi <code>infix<\/code> dipanggil tanpa titik dan tanda kurung, misalnya <code>a tambah b<\/code>.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: Operator overloading dan infix function.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/operator\\s+fun\\s+plus/i"],["kt","/infix\\s+fun/i"],["kt","/Titik/i"]],"warn":"Konsep. operator dan infix function butuh Kotlin asli.","kt":"// data class Titik(val x: Int, val y: Int) {\n//     operator fun plus(o: Titik) = Titik(x + o.x, y + o.y)\n// }\n// infix fun Int.tambah(o: Int) = this + o\n// println(Titik(1, 2) + Titik(3, 4)); println(1 tambah 2)\nfun main() {\n    println(\"operator fun dan infix fun menyusun DSL yang mudah dibaca\")\n}\n"},{"lv":"Lanjut","t":"String lanjutan","b":"String Kotlin nyediain banyak operasi buat pembersihan, pencarian, pemotongan, penggantian, dan penyusunan teks. Kenali <code>trim()<\/code>, <code>contains()<\/code>, <code>startsWith()<\/code>, <code>endsWith()<\/code>, <code>replace()<\/code>, <code>substring()<\/code>, dan <code>StringBuilder<\/code> buat perubahan string yang berulang.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa praktik: String lanjutan.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","ck":[["kt","/trim\\(/i"],["kt","/contains\\(/i"],["kt","/startsWith\\(/i"],["kt","/replace\\(/i"],["kt","/substring\\(/i"]],"kt":"fun main() {\n    val teks = \"  Kotlin String  \"\n    val rapi = teks.trim()\n    println(rapi)\n    println(rapi.contains(\"String\"))\n    println(rapi.startsWith(\"Kotlin\"))\n    println(rapi.replace(\"String\", \"Lanjut\"))\n    println(rapi.substring(0, 6))\n}","lim":"Simulator dukung operasi String dasar yang ditunjukkan. StringBuilder dan Regex bisa dipelajari lebih lanjut di Kotlin asli."},{"lv":"Lanjut","t":"Array dan indeks","b":"Array nyimpen sejumlah elemen dengan tipe yang ditentukan. Akses pakai indeks mulai dari 0. Kotlin juga punya variasi kayak <code>arrayOf()<\/code>, <code>IntArray<\/code>, dan properti <code>size<\/code>. Array berbeda dari List karena ukuran array ditentukan saat dibikin.","k":"Ubah contoh sesuai kebutuhanmu, terus pastikan semua kata kunci tantangan tetap ada.","goal":"Paham dan bisa ang contohnya pakai datamu sendiri.","cs":"using System;\nusing System.Collections.Generic;\n\nabstract class Bentuk\n{\n    public abstract double Luas();\n\n    public void Cetak()\n    {\n        Console.WriteLine($\"Luas = {Luas():F2}\");\n    }\n}\n\nclass Persegi : Bentuk\n{\n    private double sisi;\n    public Persegi(double sisi) { this.sisi = sisi; }\n    public override double Luas() { return sisi * sisi; }\n}\n\nclass Lingkaran : Bentuk\n{\n    private double r;\n    public Lingkaran(double r) { this.r = r; }\n    public override double Luas() { return Math.PI * r * r; }\n}\n\nclass Program\n{\n    static void Main()\n    {\n        List<Bentuk> daftar = new List<Bentuk> { new Persegi(3), new Lingkaran(2) };\n        foreach (Bentuk b in daftar) b.Cetak();\n    }\n}\n","ck":[["cs","/abstract\\s+class\\s+Bentuk/i"],["cs","/public\\s+abstract\\s+double\\s+Luas/i"],["cs","/override\\s+double\\s+Luas/i"],["cs","/List<Bentuk>/i"]],"lim":"Simulator nggak mencegah pembuatan objek dari abstract class; compiler C# asli akan menolaknya."},{"lv":"Lanjut","t":"Interface: kontrak perilaku","b":"<code>interface<\/code> mendefinisikan kontrak (nama method/property) tanpa implementasi; class yang mengimplementasikannya wajib nyediain semua anggota. Satu class bisa mengimplementasikan banyak interface. Nama interface lazimnya diawali <code>I<\/code>.","k":"Ubah contohnya sesukamu, tapi pastiin semua kata kunci tantangan tetap ada ya.","goal":"Paham dan bisa praktik: Interface: kontrak perilaku.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","cs":"using System;\n\ninterface IHitung\n{\n    double Hitung(double x);\n     Uji(\"2+3=5\", Tambah(2, 3) == 5);\n        Uji(\"-1+1=0\", Tambah(-1, 1) == 0);\n        Uji(\"2+2=5 (sengaja salah)\", Tambah(2, 2) == 5);\n        Console.WriteLine($\"{lulus} lulus, {gagal} gagal\");\n        System.Diagnostics.Debug.Assert(gagal == 1);\n    }\n}\n","ck":[["cs","/Debug\\.Assert/i"],["cs","/static\\s+void\\s+Uji/i"],["cs","/Tambah\\(2,\\s*3\\)\\s*==\\s*5/i"],["cs","/PASS/i"]],"lim":"xUnit/NUnit butuh .NET SDK dan paket NuGet; simulator cuma jalanin pola test runner mini kayak ini."},{"lv":"Lanjut","t":"Mini project OOP: sistem kasir","b":"Gabungin class, List, property, method, dan exception menjadi program utuh: daftar barang, keranjang belanja, dan total bayar dengan diskon.","k":"Ubah contohnya sesukamu, tapi pastiin semua kata kunci tantangan tetap ada ya.","goal":"Paham dan bisa praktik: Mini project OOP: sistem kasir.","pre":"Materi sebelumnya di bahasa ini.","why":"Konsep ini sering nongol di proyek beneran, jadi sayang kalau kelewat.","steps":["Baca contoh kodenya baris demi baris.","Ganti satu nilai atau nama.","Jalanin, terus perhatiin hasilnya.","Beresin tantangannya, terus pencet Periksa."],"hi":"Cocokin tiap kata kunci tantangan sama satu baris di kodemu.","challenge":"Tulis ulang contohnya pakai datamu sendiri.","cs":"using System;\nusing System.Collections.Generic;\n\nclass Barang\n{\n    public string Nama { get; set; }\n    public int Harga { get; set; }\n    public int Jumlah { get; set; }\n\n    public Barang(string nama, int harga, int jumlah)\n    {\n        Nama = nama;\n        Harga = harga;\n        Jumlah = jumlah;\n    }\n\n    public int Subtotal => Harga * Jumlah;\n}\n\nclass Keranjang\n{\n    private List<Barang> isi = new List<Barang>();\n\n    public void Tambah(Barang b)\n    {\n        if (b.Jumlah <= 0) throw new ArgumentException(\"jumlah harus positif\");\n        isi.Add(b);\n    }\n\n    public int Total()\n    {\n        int total = 0;\n        foreach (Barang b in isi) total += b.Subtotal;\n        return total;\n    }\n}\n\nclass Program\n{\n    static void Main()\n    {\n        Keranjang k = new Keranjang();\n        k.Tambah(new Barang(\"Pensil\", 2000, 3));\n        k.Tambah(new Barang(\"Buku\", 8000, 2));\n        int total = k.Total();\n        double diskon = total > 20000 ? 0.1 : 0;\n        Console.WriteLine($\"Total {total}, bayar {total * (1 - diskon):N0}\");\n    }\n}\n","ck":[["cs","/class\\s+Barang/i"],["cs","/class\\s+Keranjang/i"],["cs","/List<Barang>/i"],["cs","/public\\s+int\\s+Subtotal\\s*=>/i"],["cs","/throw\\s+new\\s+ArgumentException/i"]]},{"lv":"Lanjut","t":"Tes akhir: Sistem nilai siswa","b":"Bikin program C#: class Siswa dengan property, List<Siswa>, method ngitung rata-rata, foreach buat nampilin hasil, dan penentuan lulus dengan if.<p><b>Rubrik (tiap butir = bobot sama):<\/b><\/p><ol><li>class dengan constructor atau property<\/li><li>List<T> sebagai wadah data<\/li><li>Method buatan sendiri (selain Main)<\/li><li>foreach atau for buat menelusuri data<\/li><li>if/else buat nentuin lulus<\/li><li>Output muat kata rata<\/li><\/ol>","k":"Lengkapin tiap TODO sampai laporan tercetak.","goal":"Menggabungkan semua materi menjadi satu proyek utuh tanpa panduan langkah demi langkah.","pre":"Semua pelajaran sebelumnya.","why":"Proyek membuktikan kamu bisa merancang sendiri, bukan cuma mengikuti contoh.","steps":["Baca rubrik dan tulis rencana singkat.","Kerjakan satu butir rubrik dalam satu waktu.","Jalanin setelah tiap butir.","Tekan Cek jawaban; nilai proyek = butir rubrik yang terpenuhi."],"hi":"Rubrik: class + constructor/property, List<...>, method selain Main, foreach/for, if, dan Console.WriteLine yang muat kata rata.","ck":[["cs","/class\\s+\\w+[\\s\\S]*(public\\s+\\w+\\s*\\(|\\{\\s*get;)/"],["cs","/List<\\w+>/"],["cs","/static\\s+\\w+\\s+(?!Main)\\w+\\s*\\(/"],["cs","/\\b(foreach|for)\\s*\\(/"],["cs","/\\bif\\s*\\(/"],["cs","/Console\\.Write(Line)?\\([^;]*rata/i"]],"cs":"using System;\nusing System.Collections.Generic;\n\n// TODO: class function cppClean(s){
  return s
    .replace(/\/\*[\s\S]*?\*\//g,"")
    .replace(/^\s*#include[^\n]*$/gm,"")
    .replace(/^\s*using\s+namespace\s+std\s*;?\s*$/gm,"")
    .replace(/\bstd::/g,"");
}
function cppValue(v){
  v=String(v).trim();
  if(/^".*"$/.test(v)||/^'.*'$/.test(v))return v.slice(1,-1);
  if(v==="true")return true;if(v==="false")return false;
  if(/^[-+]?\d+(\.\d+)?$/.test(v))return Number(v);
  return v;
}
function cppJsExpr(e){
  e=e.trim()

   .replace(/\bnullptr\b/g,"null")
   .replace(/\.size\(\)/g,".length")

  return e;
}

function simOld(c){let v={},o="";const ev=e=>{try{return Function(...Object.keys(v),"return ("+e+")")(...Object.values(v))}catch(x){return"⚠"+e}};for(let s of c.split("\n")){s=s.trim().replace(/;$/,"");let m;if(m=s.match(/^(?:int|double|float|String)\s+(\w+)\s*=\s*(.+)$/))v[m[1]]=ev(m[2]);else if(m=s.match(/^System\.out\.(println|print)\((.*)\)$/))o+=ev(m[2])+(m[1]=="println"?"\n":"")}return o||"(gak ada output yang bisa disimulasikan)"}

function web(E,fr,l){if(l=="kotlin"||l=="csharp"){const hk="(function(){var p=function(t,a){parent.postMessage({k:t,m:[].map.call(a,function(x){try{return typeof x==\"object\"?JSON.stringify(x):String(x)}catch(e){return String(x)}}).join(\" \")},\"*\")};console.log=function(){p(\"log\",arguments)};console.error=function(){p(\"err\",arguments)};onerror=function(m){p(\"err\",[\"Error: \"+m])}})()";try{if(l=="kotlin"){const js=RUN.ktToJs(E.kt);fr.srcdoc="<script>"+hk+"<\/script><script>("+RUN.ktRuntime.toString()+")()<\/script><script>"+js.replace(/<\/script/gi,"<\\/script")+"<\/script>"}else{const r=RUN.csToJs(E.cs);fr.srcdoc="<script>"+hk+"<\/script><script>("+RUN.csRuntime.toString()+")("+JSON.stringify(r.stdin)+")<\/script><script>__run(function(){\n"+r.js.replace(/<\/script/gi,"<\\/script")+"\n})<\/script>"}}catch(e){OUTL.push("⚠ Error: "+e.message);showOut()}return}const hook='(function(){var p=function(t,a){parent.postMessage({k:t,m:[].map.call(a,function(x){try{return typeof x=="object"?JSON.stringify(x):String(x)}catch(e){return String(x)}}).join(" ")},"*")};console.log=function(){p("log",arguments)};console.error=function(){p("err",arguments)};onerror=function(m){p("err",["Error: "+m])}})()';fr.srcdoc='<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:sans-serif;padding:8px;color:#111}'+(E.c||"")+"</style>"+(E.h||"")+"<script>"+hook+"<\/script><script>"+(E.j||"").replace(/<\/script/gi,"<\\/script")+"<\/script>"}
function runLang(l,E,vis){return new Promise(res=>{OUTL=[];if(["python","cpp","c","sql"].includes(l)){const o=[];try{const R=mkRun({p:E.p,cpp:E.cpp,cc:E.cc,q:E.q},(m,e)=>o.push(e?"⚠ "+m:m),()=>{});R[l=="python"?"py":l]()}catch(e){o.push("⚠ "+e.message)}OUTL=o;showOut();res(o.join("\n"))}else{let fr=vis&&$("#fr");if(!fr){fr=document.createElement("iframe");fr.sandbox="allow-scripts";fr.style.display="none";document.body.append(fr)}CUR=fr;web(E,fr,l);setTimeout(()=>{if(!vis)fr.remove();res(OUTL.join("\n"))},900)}})}

async function chk(){S.ed[S.et]=$("#ed").value;const x=cur(),k=KY(S.l,S.i),r=P.sc[k]=P.sc[k]||{best:0,h:0,a:0},ck=(x.ck||[]).map(c=>[c[0],RX(c[1])]);const o=await runLang(S.l,S.ed,true);const m=$("#msg");if(!ck.length){m.textContent="Kode udah dijalankan. Materi ini dinilai dari hasil yang kamu amati.";return}
r.a++;const bad=ck.filter(c=>!c[1].test(c[0]=="o"?o:S.ed[c[0]]||"")).length,pc=(ck.length-bad)/ck.length;let v=pc==1?Math.max(0,100-r.h*8-Math.max(0,r.a-1)*4):Math.round(pc*60);if(v>r.best)r.best=v;if(pc==1)P.done[k]=1;save();m.style.color=pc==1?"var(--ok)":"var(--bad)";m.textContent=(pc==1?"Benar! ":"Belum tepat ("+bad+" syarat kurang). ")+"Nilai: "+v+" · terbaik "+r.best}

function mkQ(l){const out=[],ls=LS(l),f=S.f;(f=="Semua"||f=="Dasar")&&(QH[l]||[]).forEach(q=>out.push(q));ls.forEach(x=>{if(f!="Semua"&&lvOf(x)!=f)return;[["goal","Tujuan belajar “"+x.t+"” itu apa?"],["why","Kenapa “"+x.t+"” penting dipelajari?"]].forEach(([p,t])=>{if(!x[p])return;const s=z=>String(z).replace(/<[^>]*>/g,"").replace(/&lt;/g,"<").replace(/&gt;/g,">");const o=rnd(ls.filter(y=>y[p]&&s(y[p])!=s(x[p])).map(y=>s(y[p]))).filter((v,i,a)=>a.indexOf(v)==i).slice(0,2);if(o.length<2)return;const a=rnd([s(x[p]),...o]);out.push([t,a,a.indexOf(s(x[p]))])})});return rnd(out).slice(0,8)}
